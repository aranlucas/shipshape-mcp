<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shipshape MCP maintenance planning overview</title>
  <desc id="desc">A read-only flow from public GitHub signals through MCP tools to an evidence-backed action plan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091b1b"/>
      <stop offset="1" stop-color="#123738"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79e2bd"/>
      <stop offset="1" stop-color="#c4f3d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020d0d" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="1460" cy="120" r="230" fill="#79e2bd" opacity=".08"/>
  <circle cx="90" cy="800" r="230" fill="#f3c969" opacity=".07"/>
  <text x="100" y="112" fill="#79e2bd" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" letter-spacing="4">SHIPSHAPE MCP</text>
  <text x="100" y="195" fill="#f1fff9" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="800">Know what to fix next.</text>
  <text x="100" y="266" fill="#c4f3d8" font-family="Inter,Segoe UI,sans-serif" font-size="31">Public signals in. A ranked maintenance plan out.</text>
  <text x="100" y="325" fill="#9bc5ba" font-family="Inter,Segoe UI,sans-serif" font-size="28">Read-only MCP · GitHub evidence · bounded next steps</text>

  <path d="M455 540H565" stroke="#79e2bd" stroke-width="5" stroke-linecap="round"/>
  <path d="m553 526 20 14-20 14" fill="none" stroke="#79e2bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1035 540H1145" stroke="#79e2bd" stroke-width="5" stroke-linecap="round"/>
  <path d="m1133 526 20 14-20 14" fill="none" stroke="#79e2bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="100" y="405" width="355" height="270" rx="26" fill="#123333" stroke="#2b5a58" stroke-width="2"/>
    <rect x="565" y="405" width="470" height="270" rx="26" fill="#123333" stroke="#2b5a58" stroke-width="2"/>
    <rect x="1153" y="405" width="347" height="270" rx="26" fill="#1b4540" stroke="#79e2bd" stroke-width="2"/>
  </g>
  <text x="136" y="457" fill="#f3c969" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="800" letter-spacing="2">01 / PUBLIC SIGNALS</text>
  <text x="136" y="515" fill="#f1fff9" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">See the portfolio</text>
  <text x="136" y="565" fill="#9bc5ba" font-family="Inter,Segoe UI,sans-serif" font-size="23">Branches · delivery · security</text>
  <text x="136" y="599" fill="#9bc5ba" font-family="Inter,Segoe UI,sans-serif" font-size="23">releases · standards</text>
  <text x="136" y="641" fill="#79e2bd" font-family="ui-monospace,Menlo,monospace" font-size="19">public GitHub only</text>

  <text x="601" y="457" fill="#f3c969" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="800" letter-spacing="2">02 / MCP TOOLS</text>
  <text x="601" y="515" fill="#f1fff9" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">Ask the right question</text>
  <text x="601" y="565" fill="#9bc5ba" font-family="Inter,Segoe UI,sans-serif" font-size="23">`portfolio_snapshot` finds candidates.</text>
  <text x="601" y="599" fill="#9bc5ba" font-family="Inter,Segoe UI,sans-serif" font-size="23">`repo_readiness` explains the signal.</text>
  <text x="601" y="641" fill="#79e2bd" font-family="ui-monospace,Menlo,monospace" font-size="19">read-only · no code execution</text>

  <text x="1189" y="457" fill="#c4f3d8" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="800" letter-spacing="2">03 / ACTION PLAN</text>
  <text x="1189" y="515" fill="#f1fff9" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">Fix what matters</text>
  <text x="1189" y="565" fill="#d4f4e5" font-family="Inter,Segoe UI,sans-serif" font-size="23">Turn failed and unknown checks</text>
  <text x="1189" y="599" fill="#d4f4e5" font-family="Inter,Segoe UI,sans-serif" font-size="23">into a bounded work queue.</text>
  <rect x="1189" y="620" width="222" height="36" rx="18" fill="#79e2bd" opacity=".16"/>
  <text x="1209" y="645" fill="#c4f3d8" font-family="ui-monospace,Menlo,monospace" font-size="19">action_plan</text>

  <text x="100" y="790" fill="#82aaa3" font-family="Inter,Segoe UI,sans-serif" font-size="22">A calm second pair of eyes for a portfolio that outgrew its checklist.</text>
  <circle cx="1430" cy="785" r="9" fill="#79e2bd"/>
  <circle cx="1462" cy="785" r="9" fill="#f3c969"/>
  <circle cx="1494" cy="785" r="9" fill="#f1fff9" opacity=".8"/>
</svg>
