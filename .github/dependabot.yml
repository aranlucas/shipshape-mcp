version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @cloudflare/vitest-plugin only supports vitest 4; drop once it accepts 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    groups:
      cloudflare-runtime:
        patterns:
          - "@cloudflare/*"
          - agents
          - cf
      development-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
