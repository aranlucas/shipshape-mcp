version: 1
id: single-ci-workflow
title: Single protected CI workflow
summary: Keep one CI workflow that runs the package test script, with read-only contents permission, pnpm setup, and required branch checks.
kind: files
appliesTo:
  languages: [TypeScript, JavaScript]
  hasFiles: [package.json]
checks:
  - type: ci-test-script
  - type: ci-required-checks
  - type: file-exists
    path: .github/workflows/ci.yml
  - type: file-contains
    path: .github/workflows/ci.yml
    text: "uses: pnpm/setup@"
  - type: yaml-path
    file: .github/workflows/ci.yml
    path: permissions.contents
    equals: read
